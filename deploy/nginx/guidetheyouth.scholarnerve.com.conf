# Nginx site for guidetheyouth.scholarnerve.com
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/ (and linked into sites-enabled).
#
#   Website (prerendered HTML, JS, CSS, fonts):  /var/www/guidetheyouth/site
#   Uploaded photos:                             /var/lib/gtyf/uploads
#   API (Node, PM2):                             http://127.0.0.1:4310

# Visitors' real IP when the site is behind Cloudflare (safe to leave in if not).
# (Cloudflare real-IP handling: on a server that already has it in conf.d, do not include it twice.)
#include /etc/nginx/snippets/cloudflare-realip.conf;

# --- HTTP: Let's Encrypt challenges, everything else → HTTPS -----------------
server {
    listen 80;
    listen [::]:80;
    server_name guidetheyouth.scholarnerve.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guidetheyouth.scholarnerve.com;

    ssl_certificate     /etc/letsencrypt/live/guidetheyouth.scholarnerve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guidetheyouth.scholarnerve.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gtyf_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/guidetheyouth/site;
    index index.html;
    charset utf-8;

    # Phone photo uploads from the admin (the API accepts up to 20 MB each).
    client_max_body_size 25m;

    # Compression: big win on mobile data.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/gtyf-security-headers.conf;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't spoof their IP past the rate limits.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Photo uploads are resized to 7 versions on the server; give them time.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Uploaded photos: served straight from disk, cached for a year -------
    # (Each upload gets a new unique folder, so a changed photo has a new URL.)
    location /uploads/ {
        alias /var/lib/gtyf/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
        try_files $uri =404;
    }

    # --- Built JS/CSS/fonts: file names change on every build → cache forever
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
        try_files $uri =404;
    }

    location /brand/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
    }

    # --- Admin: a signed-in app shell, never cached, never indexed -----------
    location /admin {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
        try_files /200.html =404;
    }

    # --- Events, news and programmes published since the last build ---------
    # Not prerendered yet → the app shell loads them from the API.
    location ~ ^/(events|news|programmes)/[^/]+/?$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
        try_files $uri/index.html $uri /200.html;
    }

    # --- Everything else: prerendered pages; unknown URLs get the 404 page ---
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/gtyf-security-headers.conf;
    }
}
