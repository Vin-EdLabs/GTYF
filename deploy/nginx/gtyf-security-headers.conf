# Security headers for every response from the GTYF site.
# (Nginx drops parent add_header lines when a location adds its own, so each
# location includes this file.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Payments open in Paystack's secure window; nothing else needs camera, mic or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.paystack.com\")" always;
